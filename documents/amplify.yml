version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env
        - echo "SCN_AWS_REGION=$SCN_AWS_REGION" >> .env
        - echo "SCN_AWS_ACCESS_KEY_ID=$SCN_AWS_ACCESS_KEY_ID" >> .env
        - echo "SCN_AWS_SECRET_ACCESS_KEY=$SCN_AWS_SECRET_ACCESS_KEY" >> .env
        - echo "SCN_AWS_S3_BUCKET=$SCN_AWS_S3_BUCKET" >> .env
        - echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" >> .env
        - node -v
        - npm cache clean --force
        - npm ci
        - npx prisma generate
        - npx prisma migrate deploy
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
